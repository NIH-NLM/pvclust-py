[project]
name = "pvclust-py"
version = "0.1.0"
description = "Hierarchical clustering with AU p-values via multiscale bootstrap, and its federated form"
readme = "README.md"
license = "GPL-3.0-or-later"
authors = [
  { name = "Anne Deslattes Mays, PhD", email = "adeslat@scitechcon.org" },
]
requires-python = ">=3.9"
dependencies = [
  "numpy",
  "pandas",
  "scipy",
  "scikit-learn",   # k-means path in core.kmeans_pv
  "matplotlib",     # dendrograms and heatmaps
  "typer",          # CLI
]
license-files = ["LICENSE"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.scripts]
pvclust-py = "pvclust_py.cli:main"

[project.optional-dependencies]
test = ["pytest"]
notebooks = ["jupyter", "matplotlib"]
combat = ["inmoose"]   # ComBat batch correction (adjust.combat)

[build-system]
requires = ["setuptools>=77.0"]  # PEP 639 SPDX license expressions
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pvclust_py = ["data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Our own guards, firing where a test deliberately provokes them; each is asserted in
# the test that owns it. Silencing them here keeps an UNEXPECTED warning visible.
filterwarnings = [
    "ignore:only .* resampling units:UserWarning",
    "ignore:exact member-set matching recovered no cluster:UserWarning",
    "ignore:clustering rows means resampling:UserWarning",
]

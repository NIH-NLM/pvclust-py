name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # One interpreter, matching the floor in pyproject.toml. A matrix here would
      # exercise the same wheels twice: nothing in this package is interpreter-specific.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The R-parity fixtures are committed, so CI never needs R.
      - name: Install
        run: python -m pip install -e ".[test]"

      - name: Run the parity suite
        run: pytest -q

      - name: Execute the notebooks
        run: python scripts/run_notebooks.py
